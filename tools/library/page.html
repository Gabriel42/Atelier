<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset library</title>
<style>
:root {
  --bg: #f5f3ee; --panel: #fffdf9; --ink: #26231f; --muted: #6f6a61; --line: #ddd7cb;
  --accent: #9a5a14; --accent-soft: #f3e6d2; --card: #fffdf9; --well: #ebe7de;
  --credit: #a8590f; --credit-soft: #fbe9d3; --check: #b3261e; --check-soft: #f8dcd8; --free: #3f6b52; --free-soft: #dcebe1;
  --chk-a: #e9e5dc; --chk-b: #f7f5f0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1a18; --panel: #232220; --ink: #e9e5dd; --muted: #a09a8f; --line: #3a3833;
    --accent: #e2a85c; --accent-soft: #3a2f1f; --card: #252321; --well: #1f1e1c;
    --credit: #f0a860; --credit-soft: #3d2b17; --check: #f08a80; --check-soft: #3f1f1c; --free: #8fc2a3; --free-soft: #1f3327;
    --chk-a: #2c2a27; --chk-b: #353330;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; display: flex; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.mono { font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; }

/* side: packs and folders */
#side { width: 260px; flex: none; height: 100vh; overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); padding: 14px 10px 40px; }
#side h1 { font-size: 17px; margin: 0 4px 2px; }
#side .sub { color: var(--muted); font-size: 12px; margin: 0 4px 12px; }
.label { margin: 16px 4px 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.nav button { display: flex; width: 100%; align-items: center; gap: 6px; padding: 3px 8px; border: 0; border-radius: 5px; background: none; text-align: left; cursor: pointer; }
.nav button:hover { background: var(--accent-soft); }
.nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav .n { margin-left: auto; color: var(--muted); font-size: 12px; font-weight: 400; }
.nav .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--free); }
.dot.credit { background: var(--credit); } .dot.check, .dot.none { background: var(--check); } .dot.own { background: var(--muted); }
#crumbs { margin: 4px 4px 6px; font-size: 12px; color: var(--muted); word-break: break-word; }
#crumbs a { cursor: pointer; }
.legend { margin: 18px 4px 0; font-size: 12px; color: var(--muted); display: grid; gap: 3px; }
.legend span { display: flex; align-items: center; gap: 6px; }

/* top bar */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100vh; }
#bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
#search { flex: 1 1 260px; max-width: 420px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
#search:focus, #sample:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.chip .n { opacity: .7; font-size: 12px; }
#sample { width: 210px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
#bgs { display: flex; gap: 3px; align-items: center; color: var(--muted); font-size: 12px; }
#bgs button { width: 20px; height: 20px; border-radius: 4px; border: 1px solid var(--line); cursor: pointer; padding: 0; }
#bgs button.on { outline: 2px solid var(--accent); outline-offset: 1px; }
#count { color: var(--muted); font-size: 12px; margin-left: auto; }

/* grid */
#scroll { flex: 1; overflow-y: auto; padding: 14px 16px 60px; }
#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
.card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
.card:hover { border-color: var(--accent); }
.card.sel { outline: 2px solid var(--accent); outline-offset: -1px; }
.thumb { height: 120px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.thumb img { max-width: 112px; max-height: 112px; object-fit: contain; }
.thumb img.px, .big img.px { image-rendering: pixelated; max-width: none; max-height: none; }
.meta { padding: 5px 8px 6px; border-top: 1px solid var(--line); min-width: 0; }
.meta .nm { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta .sm { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { position: absolute; z-index: 1; top: 5px; right: 5px; font-size: 10px; font-weight: 600; padding: 0 6px; border-radius: 999px; line-height: 17px; }
.badge.credit { background: var(--credit-soft); color: var(--credit); }
.badge.check, .badge.none { background: var(--check-soft); color: var(--check); }
.bg-checker .thumb, .bg-checker .big { background: repeating-conic-gradient(var(--chk-a) 0 25%, var(--chk-b) 0 50%) 0 0 / 16px 16px; }
.bg-light .thumb, .bg-light .big { background: #f4f2ed; }
.bg-dark .thumb, .bg-dark .big { background: #2a2826; }
.bg-green .thumb, .bg-green .big { background: #5d8a5e; }
.card.sound .thumb, .card.font .thumb { background: var(--well) !important; }
.card.model .thumb { background: var(--well) !important; }
.card.font { grid-column: span 2; }
.card.font .thumb { padding: 8px 12px; justify-content: flex-start; font-size: 26px; line-height: 1.2; white-space: nowrap; }
.play { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--accent); color: var(--panel); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.play svg { width: 18px; height: 18px; fill: currentColor; }
.prog { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); width: 0; }
.card.sound .thumb { position: relative; flex-direction: column; gap: 4px; }
.dur { font-size: 11px; color: var(--muted); height: 14px; }
.nopv { color: var(--muted); font-size: 11px; text-align: center; padding: 0 8px; }
#more { height: 40px; }
#empty { color: var(--muted); padding: 40px; text-align: center; display: none; }

/* detail */
#detail { width: 400px; flex: none; height: 100vh; overflow-y: auto; border-left: 1px solid var(--line); background: var(--panel); display: none; }
#detail.open { display: block; }
#detail .head { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
#detail .head h2 { font-size: 15px; margin: 0; flex: 1; overflow-wrap: anywhere; }
.ibtn { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
.ibtn:hover { border-color: var(--accent); }
.big { min-height: 220px; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 12px; border-bottom: 1px solid var(--line); }
.big img { max-width: 376px; max-height: 420px; }
.big canvas { width: 376px; height: 320px; cursor: grab; touch-action: none; }
.big audio { width: 100%; }
.fontshow { width: 100%; overflow-wrap: anywhere; }
.fontshow div { margin: 4px 0; line-height: 1.2; }
.sect { padding: 10px 14px; border-bottom: 1px solid var(--line); }
.sect h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.kv { display: grid; grid-template-columns: 80px 1fr; gap: 3px 8px; font-size: 13px; }
.kv > :nth-child(odd) { color: var(--muted); }
.kv > * { min-width: 0; overflow-wrap: anywhere; }
.lic { border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.lic.free { background: var(--free-soft); } .lic.credit { background: var(--credit-soft); } .lic.check, .lic.none { background: var(--check-soft); } .lic.own { background: var(--well); }
.lic b { display: block; margin-bottom: 2px; }
.lic .credit-b { color: var(--credit); } .lic .check-b, .lic .none-b { color: var(--check); } .lic .free-b { color: var(--free); }
.lic p { margin: 4px 0; }
.copyline { display: flex; gap: 6px; align-items: flex-start; margin-top: 6px; }
.copyline code { flex: 1; background: var(--bg); border-radius: 5px; padding: 3px 6px; overflow-wrap: anywhere; }
.fmts { display: flex; flex-wrap: wrap; gap: 4px; }
.fmts a { border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; font-size: 12px; }
.hint { color: var(--muted); font-size: 12px; padding: 8px 14px; }
/* tags */
.tagrow { display: flex; gap: 3px; margin-top: 3px; overflow: hidden; height: 16px; }
.tg { font-size: 10px; line-height: 16px; padding: 0 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.card.picked { outline: 3px solid var(--accent); outline-offset: -2px; }
.card.picked::after { content: "✓"; position: absolute; top: 5px; left: 5px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--panel); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.tagedit { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.tagedit .tg { font-size: 12px; line-height: 22px; padding: 0 4px 0 9px; display: inline-flex; align-items: center; gap: 2px; }
.tagedit .tg button { border: 0; background: none; color: inherit; cursor: pointer; padding: 0 4px; font-size: 13px; line-height: 1; opacity: .7; }
.tagedit .tg button:hover { opacity: 1; }
.taginput { flex: 1 1 120px; min-width: 110px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.taginput:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#bulk { display: none; flex-wrap: wrap; align-items: center; gap: 8px; padding: 7px 16px; border-bottom: 1px solid var(--line); background: var(--accent-soft); font-size: 13px; }
#bulk.on { display: flex; }
#bulk b { color: var(--accent); }
#bulk .taginput { flex: 0 1 200px; }
#bulk select { padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.nav .tagbtn .nm::before { content: "# "; color: var(--muted); }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 6px 14px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.on { opacity: 1; }
</style>
</head>
<body class="bg-checker">
<nav id="side">
  <h1>Asset library</h1>
  <div class="sub" id="built"></div>
  <div class="label">Packs</div>
  <div class="nav" id="packs"></div>
  <div class="label">Your tags</div>
  <div class="nav" id="tags"></div>
  <div id="folders-wrap" hidden>
    <div class="label">Folders</div>
    <div id="crumbs"></div>
    <div class="nav" id="folders"></div>
  </div>
  <div class="legend">
    <span><i class="dot"></i>Free to use, no credit</span>
    <span><i class="dot credit"></i>Credit needed in the game</span>
    <span><i class="dot check"></i>Licence to check first</span>
  </div>
</nav>
<div id="main">
  <div id="bar">
    <input id="search" type="search" placeholder="Search names and folders (e.g. sword, ui click, hex)" autocomplete="off">
    <div class="chips" id="types"></div>
    <input id="sample" placeholder="Font sample text" hidden>
    <div id="bgs" title="Background behind images">Background
      <button data-bg="checker" style="background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/8px 8px"></button>
      <button data-bg="light" style="background:#f4f2ed"></button>
      <button data-bg="dark" style="background:#2a2826"></button>
      <button data-bg="green" style="background:#5d8a5e"></button>
    </div>
    <div id="count"></div>
  </div>
  <div id="bulk">
    <b id="bulkn"></b>
    <input class="taginput" id="bulkadd" list="taglist" placeholder="Add a tag to all, then Enter">
    <select id="bulkdel"></select>
    <button class="ibtn" id="bulkall">Select all shown</button>
    <button class="ibtn" id="bulkclear">Clear selection</button>
  </div>
  <datalist id="taglist"></datalist>
  <div id="scroll">
    <div id="grid"></div>
    <div id="empty">Nothing matches. Try fewer words, or another pack or type.</div>
    <div id="more"></div>
  </div>
</div>
<aside id="detail"></aside>
<div id="toast"></div>
<script>
const LIB = /*__LIBRARY_DATA__*/null;
const T = { TYPE: 0, PACK: 1, NAME: 2, FMTS: 3, SIZE: 4, W: 5, H: 6, LIC: 7 };
const TYPE_NAMES = { image: 'Images', sound: 'Sounds', font: 'Fonts', model: '3D models' };
const STATUS = {
  free: ['Free to use', 'No credit needed.'],
  credit: ['Credit needed', 'Put the credit line in the game\'s credits.'],
  check: ['Check the licence first', 'The licence has not been read yet: do not use these in a game until it is.'],
  none: ['No licence note', 'Add a licence note next to the pack before using it.'],
  own: ['Loose asset', 'No licence note found next to this file.'],
};
const FORMAT_DIR = /^(dae|fbx|gltf|glb|obj|stl|3ds|ogg|wav|mp3)( format)?$/i;
const SERVED = location.protocol.startsWith('http');
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- data helpers ----------
const items = LIB.items;
const packs = LIB.packs;
const fileOf = (it, k = 0) => `${LIB.dirs[it[T.FMTS][k][1]]}/${it[T.NAME]}.${it[T.FMTS][k][0]}`;
const urlOf = p => p.split('/').map(encodeURIComponent).join('/');
const groupDirs = LIB.dirs.map(d => d.split('/').filter(s => !FORMAT_DIR.test(s)).join('/'));
const gdir = it => groupDirs[it[T.FMTS][0][1]];
const packRoot = p => p.key;
const hay = items.map(it => `${it[T.NAME]} ${gdir(it)} ${it[T.TYPE]} ${TYPE_NAMES[it[T.TYPE]]} ${it[T.FMTS].map(f => f[0]).join(' ')}`.toLowerCase().replace(/[_\-]/g, ' '));
// ---------- your tags (saved in library/tags.json through the tool's server) ----------
const keys = items.map(it => fileOf(it));
const keyIndex = new Map(keys.map((k, i) => [k, i]));
let TAGS = LIB.tags || {};
const tagsOf = i => TAGS[keys[i]] || [];
function allTags() {
  const n = new Map();
  for (const k in TAGS) if (keyIndex.has(k)) for (const t of TAGS[k]) n.set(t, (n.get(t) || 0) + 1);
  return [...n].sort((a, b) => a[0].localeCompare(b[0], undefined, { sensitivity: 'base' }));
}
/** The spelling already in use for a tag, so "menu" and "Menu" stay one tag. */
function spell(t) {
  t = t.trim().replace(/\s+/g, ' ').slice(0, 60);
  const found = allTags().find(([x]) => x.toLowerCase() === t.toLowerCase());
  return found ? found[0] : t;
}
function changeTags(list, fn) {
  if (!SERVED) { toast('Open the page with the library tool to change tags'); return; }
  for (const i of list) {
    const next = [...new Set(fn(tagsOf(i)))].sort((a, b) => a.localeCompare(b));
    if (next.length) TAGS[keys[i]] = next; else delete TAGS[keys[i]];
  }
  saveTags();
  afterTagChange(list);
}
let saveTimer;
function saveTags() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const r = await fetch('api/tags', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Library': '1' }, body: JSON.stringify(TAGS) });
      if (!r.ok) throw new Error(r.status);
      toast('Tags saved');
    } catch { toast('Could not save the tags: is the library tool still running?'); }
  }, 300);
}
const statusOf = it => (it[T.LIC] ? (LIB.notes[it[T.LIC]].status) : packs[it[T.PACK]].status);
const kb = n => n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(0)} KB` : `${(n / 1048576).toFixed(1)} MB`;

// ---------- state (kept in the address so a refresh keeps it) ----------
const st = { q: '', type: '', pack: -1, dir: '', tag: '', bg: 'checker', sample: '', sel: -1 };
const picked = new Set();
let anchor = -1;
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  st.q = h.get('q') || ''; st.type = h.get('type') || ''; st.dir = h.get('dir') || ''; st.tag = h.get('tag') || '';
  st.pack = h.has('pack') ? packs.findIndex(p => p.name === h.get('pack')) : -1;
  st.bg = h.get('bg') || localStorage.getItem('lib-bg') || 'checker';
  st.sample = localStorage.getItem('lib-sample') || '';
}
function writeHash() {
  const h = new URLSearchParams();
  if (st.q) h.set('q', st.q);
  if (st.type) h.set('type', st.type);
  if (st.pack >= 0) h.set('pack', packs[st.pack].name);
  if (st.dir) h.set('dir', st.dir);
  if (st.tag) h.set('tag', st.tag);
  history.replaceState(null, '', '#' + h.toString());
}

// ---------- filtering ----------
let shown = [];
function filter() {
  const words = st.q.toLowerCase().replace(/[_\-]/g, ' ').split(/\s+/).filter(Boolean);
  const base = []; // matches everything but the type, for the type counts
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    if (st.pack >= 0 && it[T.PACK] !== st.pack) continue;
    if (st.dir) { const d = gdir(it); if (d !== st.dir && !d.startsWith(st.dir + '/')) continue; }
    const tags = TAGS[keys[i]];
    if (st.tag && !(tags && tags.includes(st.tag))) continue;
    if (words.length) { const h = tags ? hay[i] + ' ' + tags.join(' ').toLowerCase() : hay[i]; if (!words.every(w => h.includes(w))) continue; }
    base.push(i);
  }
  shown = st.type ? base.filter(i => items[i][T.TYPE] === st.type) : base;
  const counts = { '': base.length };
  for (const i of base) counts[items[i][T.TYPE]] = (counts[items[i][T.TYPE]] || 0) + 1;
  return counts;
}

// ---------- side ----------
function renderTagSide() {
  const tags = allTags();
  $('#tags').innerHTML = tags.length ? tags.map(([t, n]) =>
    `<button class="tagbtn${st.tag === t ? ' on' : ''}" data-tag="${esc(t)}" title="Show only “${esc(t)}” (click again to show all)"><span class="nm">${esc(t)}</span><span class="n">${n}</span></button>`).join('')
    : `<div class="hint" style="padding:0 8px">None yet. Open an asset and add a tag, or Ctrl+click cards to tag many at once.</div>`;
  $('#taglist').innerHTML = tags.map(([t]) => `<option value="${esc(t)}">`).join('');
}
function renderSide() {
  renderTagSide();
  const all = `<button data-pack="-1" class="${st.pack < 0 ? 'on' : ''}"><span class="nm">All packs</span><span class="n">${items.length}</span></button>`;
  $('#packs').innerHTML = all + packs.map((p, i) =>
    `<button data-pack="${i}" class="${st.pack === i ? 'on' : ''}" title="${esc(p.title)}"><i class="dot ${p.status}"></i><span class="nm">${esc(p.name)}</span><span class="n">${p.count}</span></button>`).join('');
  const wrap = $('#folders-wrap');
  if (st.pack < 0) { wrap.hidden = true; return; }
  wrap.hidden = false;
  const rootDir = packRoot(packs[st.pack]);
  const cur = st.dir || rootDir;
  // Sub-folders of the current folder, with how many assets each holds.
  const sub = new Map();
  for (const it of items) {
    if (it[T.PACK] !== st.pack) continue;
    const d = gdir(it);
    if (!d.startsWith(cur + '/')) continue;
    const child = d.slice(cur.length + 1).split('/')[0];
    sub.set(child, (sub.get(child) || 0) + 1);
  }
  const rel = cur.slice(rootDir.length).split('/').filter(Boolean);
  let acc = rootDir;
  $('#crumbs').innerHTML = `<a data-dir="">${esc(packs[st.pack].name)}</a>` + rel.map(s => { acc += '/' + s; return ` / <a data-dir="${esc(acc)}">${esc(s)}</a>`; }).join('');
  $('#folders').innerHTML = [...sub].sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true }))
    .map(([s, n]) => `<button data-dir="${esc(cur + '/' + s)}"><span class="nm">${esc(s)}</span><span class="n">${n}</span></button>`).join('')
    || '<div class="hint" style="padding:2px 8px">No sub-folders.</div>';
}

// ---------- grid ----------
const PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>';
const STOP = '<svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>';
let rendered = 0;
const BATCH = 240;
const fontsLoaded = new Set();
function fontFamily(i) {
  const fam = `libfont${i}`;
  if (!fontsLoaded.has(i)) {
    fontsLoaded.add(i);
    const s = document.createElement('style');
    s.textContent = `@font-face { font-family: ${fam}; src: url("${urlOf(fileOf(items[i]))}"); font-display: swap; }`;
    document.head.appendChild(s);
  }
  return fam;
}
function sampleText(it) { return st.sample || it[T.NAME].replace(/[_-]/g, ' ') + ' 0123'; }
function imgTag(it, box) {
  const w = it[T.W], h = it[T.H];
  const src = urlOf(fileOf(it));
  if (w && h && Math.max(w, h) <= box / 1.5) {
    const s = Math.max(1, Math.floor(box / Math.max(w, h)));
    return `<img class="px" loading="lazy" src="${src}" width="${w * s}" height="${h * s}" alt="">`;
  }
  return `<img loading="lazy" src="${src}" alt="">`;
}
function cardHtml(i) {

  const gl = canvas.getContext('webgl2', { antialias: true, preserveDrawingBuffer: true, alpha: true, premultipliedAlpha: false });
  if (!gl) return null;
  const sh = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); return x; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
  const loc = { p: gl.getAttribLocation(prog, 'p'), n: gl.getAttribLocation(prog, 'n'), M: gl.getUniformLocation(prog, 'M'), PV: gl.getUniformLocation(prog, 'PV'), col: gl.getUniformLocation(prog, 'col') };
  const uploaded = new WeakMap();
  function upload(model) {
    if (uploaded.has(model)) return uploaded.get(model);
    const parts = model.prims.map(pr => {
      const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
      for (const [arr, l] of [[pr.P, loc.p], [pr.N, loc.n]]) {
        const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 3, gl.FLOAT, false, 0, 0);
      }
      return { vao, count: pr.P.length / 3, col: pr.col };
    });
    uploaded.set(model, parts);
    return parts;
  }
  return {
    gl,
    draw(model, yaw, pitch, keep) {
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.enable(gl.DEPTH_TEST);
      gl.useProgram(prog);
      const s = 1 / model.radius, c = model.center;
      const center = M4.trs([-c[0] * s, -c[1] * s, -c[2] * s], undefined, [s, s, s]);
      const M = M4.mul(M4.mul(M4.rotX(pitch), M4.rotY(yaw)), center);
      const PV = M4.mul(M4.persp(0.6, canvas.width / canvas.height, 0.1, 20), M4.trs([0, 0, -3.6]));
      gl.uniformMatrix4fv(loc.M, false, M); gl.uniformMatrix4fv(loc.PV, false, PV);
      const parts = upload(model);
      for (const pt of parts) { gl.uniform4fv(loc.col, pt.col); gl.bindVertexArray(pt.vao); gl.drawArrays(gl.TRIANGLES, 0, pt.count); }
      if (!keep) { // thumbnails: free the GPU copy, the picture stays
        for (const pt of parts) gl.deleteVertexArray(pt.vao);
        uploaded.delete(model);
      }
    },
  };
}
// One hidden drawer makes every thumbnail, one at a time.
const thumbCanvas = document.createElement('canvas'); thumbCanvas.width = thumbCanvas.height = 240;
let thumbDrawer = null;
const thumbQueue = [];
let thumbBusy = false;
async function pumpThumbs() {
  if (thumbBusy) return;
  thumbBusy = true;
  while (thumbQueue.length) {
    const c = thumbQueue.shift();
    if (!c.isConnected) continue;
    const it = items[+c.dataset.model];
    const model = await loadModel(it);
    const ctx = c.getContext('2d');
    if (!model) { ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--muted'); ctx.font = '22px Segoe UI'; ctx.textAlign = 'center'; ctx.fillText('No preview', 120, 125); continue; }
    thumbDrawer = thumbDrawer || makeDrawer(thumbCanvas);
    if (!thumbDrawer) break;
    thumbDrawer.draw(model, -0.7, 0.45, false);
    ctx.clearRect(0, 0, 240, 240); ctx.drawImage(thumbCanvas, 0, 0);
  }
  thumbBusy = false;
}
const modelObserver = new IntersectionObserver(es => {
  for (const e of es) if (e.isIntersecting) {
    modelObserver.unobserve(e.target);
    if (!SERVED) { const ctx = e.target.getContext('2d'); ctx.fillStyle = '#888'; ctx.font = '20px Segoe UI'; ctx.textAlign = 'center'; ctx.fillText('Open with the tool', 120, 115); ctx.fillText('to see 3D', 120, 142); continue; }
    thumbQueue.push(e.target);
  }
  pumpThumbs();
}, { root: $('#scroll'), rootMargin: '300px' });

function startViewer(canvas, it) {
  let yaw = -0.7, pitch = 0.45, alive = true, drag = null, model = null, auto = true;
  const drawer = makeDrawer(canvas);
  loadModel(it).then(m => { model = m; if (!m) canvas.replaceWith(Object.assign(document.createElement('div'), { className: 'nopv', textContent: 'No preview for this format.' })); });
  const frame = () => {
    if (!alive) return;
    if (model && drawer) { if (auto && !drag) yaw += 0.006; drawer.draw(model, yaw, pitch, true); }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  canvas.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY, yaw, pitch]; auto = false; canvas.setPointerCapture(e.pointerId); canvas.style.cursor = 'grabbing'; });
  canvas.addEventListener('pointermove', e => { if (!drag) return; yaw = drag[2] + (e.clientX - drag[0]) * 0.01; pitch = Math.max(-1.5, Math.min(1.5, drag[3] + (e.clientY - drag[1]) * 0.01)); });
  canvas.addEventListener('pointerup', () => { drag = null; canvas.style.cursor = ''; });
  return { stop() { alive = false; drawer?.gl.getExtension('WEBGL_lose_context')?.loseContext(); } };
}

// ---------- events ----------
let qTimer;
$('#search').addEventListener('input', e => { clearTimeout(qTimer); qTimer = setTimeout(() => { st.q = e.target.value.trim(); writeHash(); renderGrid(); }, 150); });
$('#sample').addEventListener('input', e => {
  st.sample = e.target.value; localStorage.setItem('lib-sample', st.sample);
  document.querySelectorAll('.card.font').forEach(c => { c.querySelector('.thumb span').textContent = sampleText(items[+c.dataset.i]); });
});
$('#types').addEventListener('click', e => { const b = e.target.closest('[data-type]'); if (!b) return; st.type = b.dataset.type; writeHash(); renderGrid(); });
$('#packs').addEventListener('click', e => { const b = e.target.closest('[data-pack]'); if (!b) return; st.pack = +b.dataset.pack; st.dir = ''; writeHash(); renderSide(); renderGrid(); });
$('#side').addEventListener('click', e => { const b = e.target.closest('[data-dir]'); if (!b) return; st.dir = b.dataset.dir; writeHash(); renderSide(); renderGrid(); });
$('#bgs').addEventListener('click', e => { const b = e.target.closest('[data-bg]'); if (!b) return; setBg(b.dataset.bg); });
function setBg(bg) { st.bg = bg; localStorage.setItem('lib-bg', bg); document.body.className = 'bg-' + bg; document.querySelectorAll('#bgs button').forEach(b => b.classList.toggle('on', b.dataset.bg === bg)); }
$('#grid').addEventListener('click', e => {
  const pb = e.target.closest('[data-play]');
  if (pb) { e.stopPropagation(); play(+pb.dataset.play); return; }
  const c = e.target.closest('.card'); if (!c) return;
  if (e.ctrlKey || e.metaKey || e.shiftKey) { e.preventDefault(); togglePick(+c.dataset.i, e.shiftKey); return; }
  anchor = +c.dataset.i;
  openDetail(+c.dataset.i);
});
$('#tags').addEventListener('click', e => {
  const b = e.target.closest('[data-tag]'); if (!b) return;
  st.tag = st.tag === b.dataset.tag ? '' : b.dataset.tag; writeHash(); renderTagSide(); renderGrid();
});
const splitTags = v => v.split(',').map(spell).filter(Boolean);
$('#detail').addEventListener('keydown', e => {
  if (e.target.id !== 'tagadd' || e.key !== 'Enter') return;
  const add = splitTags(e.target.value);
  if (add.length && st.sel >= 0) changeTags([st.sel], ts => [...ts, ...add]);
});
$('#bulkadd').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const add = splitTags(e.target.value);
  if (!add.length) return;
  changeTags([...picked], ts => [...ts, ...add]);
  e.target.value = '';
  toast(`Tagged ${picked.size} asset${picked.size > 1 ? 's' : ''}`);
});
$('#bulkdel').addEventListener('change', e => {
  const t = e.target.value; if (!t) return;
  changeTags([...picked], ts => ts.filter(x => x !== t));
});
$('#bulkall').addEventListener('click', () => { for (const i of shown) picked.add(i); refreshPicked(); });
$('#bulkclear').addEventListener('click', () => { picked.clear(); refreshPicked(); });
$('#detail').addEventListener('click', e => {
  if (e.target.closest('[data-close]')) return closeDetail();
  const u = e.target.closest('[data-untag]');
  if (u) return changeTags([st.sel], ts => ts.filter(x => x !== u.dataset.untag));
  const s = e.target.closest('[data-step]'); if (s) return step(+s.dataset.step);
  const c = e.target.closest('[data-copy]');
  if (c) navigator.clipboard.writeText(c.dataset.copy).then(() => toast('Copied'), () => toast('Could not copy'));
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.key === 'Escape') { if (picked.size) { picked.clear(); refreshPicked(); } else closeDetail(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { if (st.sel >= 0) { e.preventDefault(); step(1); } }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { if (st.sel >= 0) { e.preventDefault(); step(-1); } }
  else if (e.key === '/') { e.preventDefault(); $('#search').focus(); }
});

// ---------- start ----------
function start() {
  readHash();
  $('#search').value = st.q;
  $('#sample').value = st.sample;
  setBg(st.bg);
  renderSide();
  renderGrid();
}
$('#built').textContent = `${items.length} assets · built ${new Date(LIB.built).toLocaleString()}`;
window.addEventListener('hashchange', start);
start();
// Tags may have changed since the page was built: take the saved ones.
if (SERVED) fetch('api/tags', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(t => {
  if (!t || JSON.stringify(t) === JSON.stringify(TAGS)) return;
  TAGS = t; renderTagSide(); renderGrid();
}).catch(() => {});
</script>
